# An ann-benchmarks corpus in HDF5 form: GloVe 100-dimensional angular embeddings, run with the
# COSINE metric. Download glove-100-angular.hdf5 from https://ann-benchmarks.com and point
# corpus.path at the file; the train, test, and neighbors datasets supply the rows, the panel,
# and the published ground truth.

jdbc.url=jdbc:phoenix:zk1,zk2,zk3:2181
run.variant=hnsw
run.output.dir=vector-harness-output

corpus.source=hdf5
corpus.path=/data/ann-benchmarks/glove-100-angular.hdf5
corpus.rows=1183514
index.metric=COSINE

table.layouts=corpus
table.regions=16

hnsw.m=24
hnsw.ef_construction=200

query.k.values=10,100
query.hnsw.ef.values=32,64,128,256,512
query.shapes=unfiltered,covered_filter,uncovered_filter
query.rate.per_sec=50
query.threads=8
mutation.rate.per_sec=0
steady_state.duration=5m
