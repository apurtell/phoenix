# HNSW under continuous ingestion: a fifth of the corpus is present when the index is built and
# the rest streams in through the live write path, which exercises mutable graph buffering, delta
# segment flushes, ratio-triggered rebuilds, and split requests. The steady state adds mutations
# concentrated on two regions and a schedule of region disruptions, and samples recall online.

jdbc.url=jdbc:phoenix:zk1,zk2,zk3:2181
run.variant=hnsw
run.output.dir=vector-harness-output

corpus.source=synthetic
corpus.rows=2000000
corpus.dim=256
corpus.clusters=100
corpus.drift.mode=migrate
corpus.drift.rate=0.05
index.metric=L2

table.layouts=corpus
table.regions=8

hnsw.m=16
hnsw.ef_construction=100

ingest.prebuild.fraction=0.2
ingest.stream.rate.per_sec=5000
ingest.threads=8

query.k.values=10
query.hnsw.ef.values=32,64,128,256
query.rate.per_sec=50
query.threads=8

mutation.rate.per_sec=500
mutation.mix=0.6,0.3,0.1
mutation.hotspot.regions=2
mutation.threads=4
steady_state.warmup=1m
steady_state.duration=30m
recall.sample.mode=online
recall.sample.interval=30s
observe.fsck.interval=5m
disruption.schedule=5m:split,10m:compact,15m:move,20m:merge
