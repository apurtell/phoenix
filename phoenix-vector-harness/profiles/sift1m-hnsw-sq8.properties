# The SIFT1M benchmark (128 dimensions, L2) under an HNSW index with 8-bit scalar quantization,
# the session of the design document.
#
# The corpus is the ANN-Benchmarks copy of SIFT1M, sift-128-euclidean.hdf5 from
# https://ann-benchmarks.com. Its train, test, and neighbors datasets hold the 1,000,000 base
# vectors, the 10,000 queries, and the 100 nearest neighbors of each query. The rows have the
# same order as in the texmex files. The distance attribute of the file is euclidean, which
# agrees with index.metric=L2.
# docker/scripts/fetch-data.sh downloads the file and verifies its checksum.
#
# The steady state inserts rows, so the run needs new vectors that the index has not seen.
# corpus.holdout.rows=100000 holds out the last 100,000 train rows: the load uses the first
# 900,000 rows, and each insert or move takes a distinct row of the tail. The steady window and
# the sequence number of the operation select the row, so paired runs write the same rows. The
# steady state draws at most about 61,200 new vectors, and configuration validation fails when
# the tail is too small.
# The published ground truth covers all rows, so the run uses only the computed ground truth.
# A read-only run (mutation.rate.per_sec=0, corpus.holdout.rows=auto) loads all rows, and the
# load and truth phases then validate the computed ground truth against the published one.
#
# To read the texmex files instead, set corpus.source=texmex and point corpus.path at the
# directory of sift_base.fvecs, sift_query.fvecs, and sift_groundtruth.ivecs. With
# sift_learn.fvecs in that directory, mutations take their new vectors from it and the load
# uses all base rows. The corpus fingerprint names the source, so runs of the two forms do not
# compare and do not share cached ground truth.

jdbc.url=jdbc:phoenix:zk1,zk2,zk3:2181
run.variant=hnsw
run.output.dir=vector-harness-output

corpus.source=hdf5
corpus.path=/data/ann-benchmarks/sift-128-euclidean.hdf5
corpus.rows=1000000
corpus.holdout.rows=100000
corpus.tenants=1

index.metric=L2
table.layouts=corpus,profile
table.regions=16
table.snapshot=true

hnsw.m=16
hnsw.ef_construction=100
hnsw.alpha=1.2
hnsw.quantization=SQ8

ingest.threads=8
ingest.batch.size=1000

query.k.values=10,100
query.hnsw.ef.values=16,32,64,128,256,512
query.filter.selectivity=0.001,0.01,0.1,1.0
query.threads=8
query.rate.values=50,100,200

mutation.rate.per_sec=100
steady_state.warmup=1m
steady_state.duration=10m
recall.panel.size=1000
report.recall.targets=0.90,0.95,0.99
report.latency.budgets=10ms,25ms
