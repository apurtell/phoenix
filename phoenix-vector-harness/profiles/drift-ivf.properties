# IVF under centroid drift: the cluster centers migrate during the steady state, so that the
# trained centroids fit the data less and less, and an explicit rebuild part way through restores
# the fit. The lifecycle CSV records the drift scorecard and the generations; the recall time series
# shows the decline and the recovery.

jdbc.url=jdbc:phoenix:zk1,zk2,zk3:2181
run.variant=ivf
run.output.dir=vector-harness-output

corpus.source=synthetic
corpus.rows=1000000
corpus.dim=128
corpus.clusters=100
corpus.drift.mode=migrate
corpus.drift.rate=0.2
index.metric=L2

table.layouts=corpus
table.regions=16

ivf.lists=1024
ivf.sample_size=50000

query.k.values=10
query.ivf.probe.values=4,16,64
query.rate.per_sec=50
query.threads=8

mutation.rate.per_sec=1000
mutation.mix=0.2,0.7,0.1
mutation.update.move_fraction=0.8
mutation.update.attribute_fraction=0.1
mutation.threads=8
steady_state.warmup=1m
steady_state.duration=40m
rebuild.auto.enabled=false
rebuild.explicit.at=20m
recall.sample.interval=1m
