# The composite scenario of the design at its default scale: a multi-tenant document and passage
# retrieval service with one million 768-dimensional COSINE embeddings, skewed tenants and
# attribute vocabularies, both table layouts, every query shape, and a mixed mutation workload.
# Run it once per variant with -Drun.variant=exact|ivf|hnsw.

jdbc.url=jdbc:phoenix:zk1,zk2,zk3:2181
run.variant=hnsw
run.output.dir=vector-harness-output

corpus.source=synthetic
corpus.seed=42
corpus.rows=1000000
corpus.dim=768
corpus.clusters=200
corpus.cluster.weights=zipf:0.8
corpus.variance.spread=4.0
corpus.intrinsic_dim=64
corpus.query.boundary_fraction=0.1
corpus.query.ood_fraction=0.02
corpus.filter.skew=zipf:1.1
corpus.tenants=100
corpus.tenant.skew=zipf:1.2

table.layouts=corpus,profile
table.multi_tenant=true
table.regions=16
table.snapshot=true
index.metric=COSINE

ivf.lists=1024
ivf.sample_size=50000
hnsw.m=16
hnsw.ef_construction=100

query.k.values=10,100
query.shapes=all
query.tenant_scoped.fraction=0.8
query.threads=8
query.rate.values=20,50,100

mutation.rate.per_sec=50
mutation.mix=0.5,0.4,0.1
mutation.update.move_fraction=0.2
steady_state.warmup=1m
steady_state.duration=10m
recall.panel.size=1000
