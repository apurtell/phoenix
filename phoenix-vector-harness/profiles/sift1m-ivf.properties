# The SIFT1M benchmark under an IVF index, comparable with sift1m-hnsw-sq8.properties: the
# corpus, panel, shapes, rates, and mutations are identical, and only the variant and its tuning
# differ, so that
#
#   vector-harness report --run-id <hnsw-run> --compare <ivf-run>
#
# accepts the pair. IVF trains its centroids on the rows present at build time.

jdbc.url=jdbc:phoenix:zk1,zk2,zk3:2181
run.variant=ivf
run.output.dir=vector-harness-output

corpus.source=texmex
corpus.path=/data/texmex/sift
corpus.name=sift
corpus.rows=1000000
corpus.tenants=1

index.metric=L2
table.layouts=corpus,profile
table.regions=16
table.snapshot=true

ivf.lists=1024
ivf.sample_size=50000

ingest.threads=8
ingest.batch.size=1000

query.k.values=10,100
query.ivf.probe.values=1,4,16,64,all
query.ivf.max_probe_limit=8
query.filter.selectivity=0.001,0.01,0.1,1.0
query.threads=8
query.rate.values=50,100,200

mutation.rate.per_sec=100
steady_state.warmup=1m
steady_state.duration=10m
recall.panel.size=1000
report.recall.targets=0.90,0.95,0.99
report.latency.budgets=10ms,25ms
