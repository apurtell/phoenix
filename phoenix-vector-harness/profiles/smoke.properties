# A quick functional check of a cluster: a small synthetic corpus, both table layouts, every query
# shape, and short steady-state windows. The variant is chosen on the command line, so that the
# runs of the three variants share every other parameter and can be compared:
#
#   vector-harness load        --config smoke.properties -Drun.variant=hnsw
#   vector-harness build-index --config smoke.properties -Drun.variant=hnsw
#   vector-harness run         --config smoke.properties -Drun.variant=hnsw
#
# The tables of each variant are distinct (the table suffix defaults to the variant and the
# profile name), so all three can be loaded side by side.

jdbc.url=jdbc:phoenix:localhost
run.variant=ivf
run.output.dir=vector-harness-output

corpus.source=synthetic
corpus.rows=20000
corpus.dim=64
corpus.clusters=32
corpus.intrinsic_dim=16
corpus.filter.categories=100
corpus.filter.sources=100
corpus.tenants=8

table.layouts=corpus,profile
table.regions=4
index.metric=COSINE

ivf.lists=64
ivf.sample_size=5000
hnsw.m=16
hnsw.ef_construction=100

query.k.values=10
query.ivf.probe.values=1,4,16,all
query.hnsw.ef.values=16,64,256
query.filter.selectivity=0.01,0.1,1.0
query.threads=4
query.rate.per_sec=20

mutation.rate.per_sec=5
steady_state.warmup=10s
steady_state.duration=1m
recall.panel.size=200
recall.sample.interval=10s
observe.interval=5s
