# Screening thresholds for the run checks in check-run.sh.
# These values find gross deficits only. They are not performance targets.
# Calibrate them on the first full-scale baseline. After that, change them only on purpose.
# A later line wins over an earlier line with the same key.

# Recall selection. The recall checks use recall@k on the query families that match this regex.
# Filtered families have their own recall curves, so the gates use the unfiltered family.
recall.families=^unfiltered$
recall.k=10

# Smoke recall gates.
# Exact search can return a different neighbor when two distances are equal, so 1.0 is too strict.
smoke.recall.exact.min=0.999
smoke.recall.ivf_all.min=0.99
smoke.recall.hnsw_ef256.min=0.95

# Query errors in the frontier and the steady windows.
query.errors.max=0

# HNSW regions without a covering segment after the build.
hnsw.regions_uncovered.max=0

# Index slower than brute force: at the recall level below, the index must reach this
# multiple of the exact QPS.
index.qps_vs_exact.min_ratio=5
index.qps_vs_exact.recall=0.9

# HNSW restriction. The gauges of unrestricted, uncovered and overflowed regions must stay at
# this value during the frontier. The latency at the largest ef must be at least this multiple
# of the latency at the smallest ef. A flat curve is a warning.
hnsw.restriction.max=0
hnsw.ef_latency.min_rise=1.05

# IVF probes. Recall at these probe points must rise with the probe count.
# Identical recall at all points shows a probe defect, unless the recall is already saturated.
ivf.probe.values=16,64,all
ivf.probe.recall.tolerance=0.01
ivf.probe.recall.saturated=0.999

# Off-heap. A refusal fails the run. Evictions and segment loads in steady state are warnings.
hnsw.offheap.refusals.max=0
hnsw.offheap.evictions.steady.max=0
hnsw.segment_loads.steady.max=0

# GC time as a fraction of wall time on any region server.
gc.time.fraction.max=0.10

# Saturation. The VM CPU is saturated at this fraction while the steady window does not reach
# this fraction of its target rate.
cpu.saturation.fraction=0.90
qps.target.fraction=0.90

# Client-bound run. The harness container uses this fraction of its CPU limit.
harness.cpu.fraction=0.90

# Read skew across the region servers in the steady windows: the read requests of the busiest
# server over the mean per server. An even spread gives 1.0, and one server that serves all reads
# gives the server count (3 on the docker cluster). The counter covers all tables. Data table reads
# usually spread evenly and dilute the skew of the index. System tables sit on one server and raise
# it a little. On the docker cluster, runs with an even layout (HNSW in the
# data regions, exact scans) gave 1.03 to 1.34. Runs with the IVF index in one region gave up to
# 2.44. At the warning value, one server does half again its share. At the failure value, one
# server does twice its share, which is two thirds of all reads on three servers.
read.skew.warn=1.5
read.skew.fail=2.0

# Tail latency in steady windows without a disruption.
tail.p99_over_p50.max=10

# Recovery after a disruption.
recovery.mttr.max_seconds=120
recovery.error.grace_seconds=30

# The largest gap below full recall at the highest sweep point. The check applies when the
# computed ground truth agrees with the published one, or when a prefix has no published truth.
published.recall.gap.max=0.05

# Recall drop from the value before the first disruption to the value at the end.
disruption.recall.drop.max=0.05

# Before the explicit IVF rebuild, recall must fall below the drift baseline by this margin.
# The drift baseline is the early steady recall. Without this drop, the run does not show drift.
# The recovery check then has no meaning. The value is larger than the change in recall between
# early samples of a run without drift.
drift.recall.drop.min=0.03

# After the explicit IVF rebuild, recall must win back this fraction of the measured drop.
# The recall at the end must reach before + (baseline - before) * fraction.
drift.recall.recovery.min=0.5

# Recall samples in the steady state of a disruption run.
recall.samples.min=3

# Rebuild wait time over rebuild time. A higher value means that the rebuild queue dominates.
hnsw.rebuild.wait_over_time.max=1.0

# The number of query families with results in the functional multi-tenant run.
functional.families.min=13

# Log lines that fail a run, and log lines that make a warning. The values are extended regexes.
log.fail.patterns=OutOfMemoryError|MaxDirectMemorySize|cannot retain them and queries reload them
log.warn.patterns= ERROR |RegionTooBusyException|CallQueueTooBigException|responseTooSlow
