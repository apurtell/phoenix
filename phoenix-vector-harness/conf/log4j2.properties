# Logging of the vector harness launcher. The harness prints its progress and results on standard
# output; log messages go to standard error, and optionally to a file named by
# -Dvector.harness.log.file.

status = warn
dest = err
name = VectorHarnessLogging

appender.console.type = Console
appender.console.target = SYSTEM_ERR
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %-5p [%t] %c{2}: %.1000m%n

appender.file.type = File
appender.file.name = file
appender.file.fileName = ${sys:vector.harness.log.file:-vector-harness.log}
appender.file.createOnDemand = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{ISO8601} %-5p [%t] %c{2}: %.1000m%n

rootLogger = ${sys:vector.harness.root.logger:-WARN,console}

logger.harness.name = org.apache.phoenix.vectorharness
logger.harness.level = INFO
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = ERROR
logger.hbase_zk.name = org.apache.hadoop.hbase.zookeeper
logger.hbase_zk.level = ERROR
logger.hbase_conf.name = org.apache.hadoop.hbase.HBaseConfiguration
logger.hbase_conf.level = ERROR
logger.mapreduce.name = org.apache.hadoop.mapreduce
logger.mapreduce.level = WARN
