# The thresholds of the cluster checks. Every threshold lives here, and no
# check script holds a literal: a check reads each value with sx_threshold.
# A line is key=number. The thresholds hook of a plug-in replaces single keys
# or adds new ones, and suites/check-cluster.sh writes the merged set into
# the bundle. docs/bundle-format.md, section "The cluster checks", defines
# the subject of each key.

# Verbs that px-run stopped at a time limit or that a signal ended.
wrapper.terminations.max=0

# Restarts, exits and losses of an instance that no planned action covers.
restart.unplanned.max=0

# Out-of-memory kills, and the peak memory of an instance in percent of its
# container limit.
oom.kills.max=0
oom.peak_pct.max=95

# ERROR and FATAL lines, and WARN lines, in the instance logs of the run.
log.errors.max=0
log.warnings.max=100

# The longest garbage-collection pause of a JVM instance, in milliseconds.
gc.pause_ms.max=1000

# The mttr of each disruption, in seconds: the two-minute recovery gate. The Kubernetes backend sets
# its own bound in k8s/env/k8s.env, which adds the time that its CPU limits cost.
recovery.seconds.max=120

# Faults that remain after the last recovery.
post_recovery.faults.max=0

# The steady-state checks of suites/checks/steady.sh: the highest p99 query
# latency of a steady window in milliseconds, and the lowest throughput
# attainment, the achieved rate in percent of the offered rate. Both are time
# evidence, so px-report demotes a FAIL of either to ADVISORY unless the time
# evidence is authoritative.
steady.p99_ms.max=1000
steady.attainment_pct.min=90
